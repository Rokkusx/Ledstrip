<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mijn Ledstrip</title>
<style>
  :root { --bg:#0d0f14; --card:#171a22; --line:#262b37; --fg:#e8eaf0; --mut:#8b92a5; --acc:#7c5cff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.4 system-ui,-apple-system,Segoe UI,sans-serif; }
  .wrap { max-width:560px; margin:0 auto; padding:20px 16px 60px; }
  header { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:16px; }
  h1 { font-size:20px; margin:0; }
  .dot { width:10px; height:10px; border-radius:50%; background:#555; display:inline-block; margin-right:8px; }
  .dot.on { background:#3ddc84; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:14px; }
  .card h2 { font-size:13px; text-transform:uppercase; letter-spacing:.08em; color:var(--mut); margin:0 0 12px; font-weight:600; }
  button { background:#232838; color:var(--fg); border:1px solid var(--line); border-radius:10px; padding:10px 14px; font:inherit; cursor:pointer; }
  button:hover { background:#2b3146; }
  button.primary { background:var(--acc); border-color:var(--acc); font-weight:600; }
  button.primary:hover { background:#8f73ff; }
  button.active { outline:2px solid var(--acc); }
  button:disabled { opacity:.4; cursor:not-allowed; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .row > * { flex:0 0 auto; }
  label.sl { display:flex; align-items:center; gap:12px; margin-top:12px; color:var(--mut); }
  label.sl span:first-child { width:90px; }
  label.sl input { flex:1; accent-color:var(--acc); }
  input[type=color] { width:64px; height:44px; border:none; background:none; padding:0; cursor:pointer; }
  .swatches button { width:40px; height:40px; border-radius:50%; padding:0; border:2px solid var(--line); }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .scenes { display:flex; flex-direction:column; gap:8px; margin-top:10px; }
  .scene { display:flex; gap:8px; align-items:center; }
  .scene .chip { width:22px; height:22px; border-radius:6px; border:1px solid var(--line); }
  .scene button:nth-child(2) { flex:1; text-align:left; }
  .mut { color:var(--mut); font-size:13px; }
  .bar { height:8px; background:#232838; border-radius:6px; overflow:hidden; margin-top:10px; }
  .bar > div { height:100%; width:0; background:var(--acc); transition:width .05s; }
  #warn { background:#3a1d22; border:1px solid #6b2c36; color:#ffb4bf; border-radius:10px; padding:12px; margin-bottom:14px; display:none; }
  input[type=text] { background:#0d0f14; color:var(--fg); border:1px solid var(--line); border-radius:10px; padding:10px 12px; font:inherit; flex:1; min-width:0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>💡 Mijn Ledstrip</h1>
    <div class="row">
      <span id="status" class="mut"><span class="dot" id="dot"></span><span id="statusTxt">Niet verbonden</span></span>
      <button class="primary" id="btnConnect">Verbinden</button>
    </div>
  </header>

  <div id="warn">Web Bluetooth werkt alleen in Chrome of Edge (niet Safari of Firefox). Open dit bestand daar.</div>

  <div class="card">
    <h2>Basis</h2>
    <div class="row">
      <button id="btnOn">Aan</button>
      <button id="btnOff">Uit</button>
      <input type="color" id="color" value="#ff2d55" title="Kleur">
    </div>
    <label class="sl"><span>Helderheid</span><input type="range" id="bri" min="1" max="100" value="100"><span id="briVal">100%</span></label>
    <div class="swatches row" id="swatches" style="margin-top:14px"></div>
  </div>

  <div class="card">
    <h2>Effecten</h2>
    <div class="grid" id="effects"></div>
    <label class="sl"><span>Snelheid</span><input type="range" id="speed" min="1" max="100" value="40"><span id="speedVal">40</span></label>
    <div class="row" style="margin-top:12px"><button id="btnStopFx">Stop effect</button></div>
  </div>

  <div class="card">
    <h2>Muziek (microfoon)</h2>
    <div class="row">
      <button id="btnMic">🎤 Start muziekmodus</button>
    </div>
    <label class="sl"><span>Gevoeligheid</span><input type="range" id="sens" min="1" max="100" value="60"></label>
    <div class="bar"><div id="level"></div></div>
    <p class="mut" style="margin:10px 0 0">Bas bepaalt de helderheid, de kleur wisselt mee op de beat.</p>
  </div>

  <div class="card">
    <h2>Mijn scènes</h2>
    <div class="row">
      <input type="text" id="sceneName" placeholder="Naam van scène, bijv. Chill">
      <button id="btnSaveScene">Opslaan</button>
    </div>
    <div class="scenes" id="scenes"></div>
    <p class="mut" style="margin:10px 0 0">Slaat de huidige kleur en helderheid op.</p>
  </div>

  <div class="card">
    <h2>Timer</h2>
    <div class="row">
      <button data-timer="15">Uit over 15 min</button>
      <button data-timer="30">30 min</button>
      <button data-timer="60">60 min</button>
      <button id="btnTimerCancel">Annuleer</button>
    </div>
    <p class="mut" id="timerTxt" style="margin:10px 0 0"></p>
  </div>
</div>

<script>
// ===== Protocol: ELK-BLEDOB / LotusLamp X (variant A) =====
const SERVICE_UUID = 0xfff0;
const CHAR_UUID    = '0000fff3-0000-1000-8000-00805f9b34fb';
const CMD_ON  = Uint8Array.from([0x7e,0x07,0x04,0xff,0x00,0x01,0x02,0x01,0xef]);
const CMD_OFF = Uint8Array.from([0x7e,0x07,0x04,0x00,0x00,0x00,0x02,0x01,0xef]);
const cmdColor = (r,g,b) => Uint8Array.from([0x7e,0x07,0x05,0x03,r,g,b,0x10,0xef]);

// ===== State =====
let device = null, characteristic = null;
let busy = false, pending = null, lastSent = '';
let base = {r:255, g:45, b:85};   // gekozen kleur
let brightness = 100;             // 0-100, software gedimd
let fx = null, fxTimer = null, fxT = 0;
let micCtx = null, micStream = null, micRaf = null;
let timerHandle = null, timerEnd = 0, timerTick = null;

const $ = id => document.getElementById(id);
const hexToRgb = h => ({r:parseInt(h.slice(1,3),16), g:parseInt(h.slice(3,5),16), b:parseInt(h.slice(5,7),16)});
const rgbToHex = (r,g,b) => '#'+[r,g,b].map(v=>Math.round(v).toString(16).padStart(2,'0')).join('');
function hsv(h,s,v){ // h 0-360, s,v 0-1
  const f=(n,k=(n+h/60)%6)=>v-v*s*Math.max(Math.min(k,4-k,1),0);
  return {r:f(5)*255, g:f(3)*255, b:f(1)*255};
}

if (!navigator.bluetooth) $('warn').style.display = 'block';

// ===== Bluetooth =====
function setStatus(on, txt){ $('dot').classList.toggle('on', on); $('statusTxt').textContent = txt; $('btnConnect').textContent = on ? 'Verbreek' : 'Verbinden'; }

async function connect(){
  if (characteristic) { device.gatt.disconnect(); return; }
  try {
    device = await navigator.bluetooth.requestDevice({
      filters: [{namePrefix:'ELK'}, {namePrefix:'MELK'}, {namePrefix:'LEDBLE'}],
      optionalServices: [SERVICE_UUID]
    });
    device.addEventListener('gattserverdisconnected', () => { characteristic = null; stopFx(); stopMic(); setStatus(false,'Niet verbonden'); });
    setStatus(false,'Verbinden...');
    const server = await device.gatt.connect();
    const svc = await server.getPrimaryService(SERVICE_UUID);
    characteristic = await svc.getCharacteristic(CHAR_UUID);
    setStatus(true, device.name || 'Verbonden');
    lastSent = '';
    await write(CMD_ON);
    applyColor();
  } catch (e) {
    console.error(e);
    setStatus(false, e.name === 'NotFoundError' ? 'Geen apparaat gekozen' : 'Fout: ' + e.message);
  }
}

async function write(bytes){
  if (!characteristic) return;
  try { await characteristic.writeValueWithoutResponse(bytes); }
  catch(e){ console.warn('write fout', e); }
}

// "Laatste wint": bij snelle updates (effecten/muziek) slaan we oude frames over.
async function sendRGB(r,g,b){
  r=Math.max(0,Math.min(255,Math.round(r))); g=Math.max(0,Math.min(255,Math.round(g))); b=Math.max(0,Math.min(255,Math.round(b)));
  const key = r+','+g+','+b;
  if (key === lastSent && !pending) return;
  pending = [r,g,b];
  if (busy) return;
  busy = true;
  while (pending) {
    const [pr,pg,pb] = pending; pending = null;
    lastSent = pr+','+pg+','+pb;
    await write(cmdColor(pr,pg,pb));
    await new Promise(res => setTimeout(res, 25));
  }
  busy = false;
}

function dim(c, factor=1){ const k = (brightness/100)*factor; return [c.r*k, c.g*k, c.b*k]; }
function applyColor(){ sendRGB(...dim(base)); }

// ===== UI: basis =====
$('btnConnect').onclick = connect;
$('btnOn').onclick  = async () => { await write(CMD_ON); lastSent=''; applyColor(); };
$('btnOff').onclick = async () => { stopFx(); stopMic(); await write(CMD_OFF); };

$('color').oninput = e => { stopFx(); stopMic(); base = hexToRgb(e.target.value); applyColor(); };
$('bri').oninput = e => { brightness = +e.target.value; $('briVal').textContent = brightness+'%'; if(!fx && !micRaf) applyColor(); };

const swatchColors = ['#ff0000','#ff6a00','#ffd400','#00ff55','#00e5ff','#0066ff','#8a2be2','#ff2dd1','#ffffff','#ffb46b'];
swatchColors.forEach(c => {
  const b = document.createElement('button'); b.style.background = c; b.title = c;
  b.onclick = () => { stopFx(); stopMic(); base = hexToRgb(c); $('color').value = c; applyColor(); };
  $('swatches').appendChild(b);
});

// ===== Effecten =====
const EFFECTS = {
  'Regenboog': t => hsv((t*60)%360, 1, 1),
  'Ademen':    t => { const k=(Math.sin(t*2)+1)/2; const c=base; return {r:c.r*k,g:c.g*k,b:c.b*k}; },
  'Strobe':    t => (Math.floor(t*6)%2) ? base : {r:0,g:0,b:0},
  'Vuur':      t => { const k=0.35+Math.random()*0.65; return {r:255*k, g:(60+Math.random()*50)*k, b:5*k}; },
  'Party':     t => hsv(Math.floor(t*2)*47 % 360, 1, 1),
  'Zonsondergang': t => { const k=(Math.sin(t*0.6)+1)/2; return {r:255, g:30+k*110, b:k*30}; },
};
Object.keys(EFFECTS).forEach(name => {
  const b = document.createElement('button'); b.textContent = name; b.dataset.fx = name;
  b.onclick = () => startFx(name);
  $('effects').appendChild(b);
});
$('speed').oninput = e => $('speedVal').textContent = e.target.value;

function startFx(name){
  stopMic(); stopFx(); fx = name; fxT = 0;
  document.querySelectorAll('#effects button').forEach(b => b.classList.toggle('active', b.dataset.fx === name));
  let last = performance.now();
  fxTimer = setInterval(() => {
    const now = performance.now(); const dt = (now-last)/1000; last = now;
    fxT += dt * (0.2 + $('speed').value/25);   // snelheid schaalt de tijd
    const c = EFFECTS[name](fxT);
    sendRGB(...dim(c));
  }, 45);
}
function stopFx(){
  if (fxTimer) clearInterval(fxTimer);
  fxTimer = null; fx = null;
  document.querySelectorAll('#effects button').forEach(b => b.classList.remove('active'));
}
$('btnStopFx').onclick = () => { stopFx(); applyColor(); };

// ===== Muziekmodus =====
async function startMic(){
  if (!characteristic) { alert('Verbind eerst met de strip.'); return; }
  stopFx();
  try {
    micStream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false, noiseSuppression:false, autoGainControl:false}});
  } catch(e){ alert('Microfoon geweigerd: ' + e.message); return; }
  micCtx = new (window.AudioContext||window.webkitAudioContext)();
  const src = micCtx.createMediaStreamSource(micStream);
  const an = micCtx.createAnalyser(); an.fftSize = 512; an.smoothingTimeConstant = 0.6;
  src.connect(an);
  const data = new Uint8Array(an.frequencyBinCount);
  let hue = 0, avg = 0, smooth = 0, lastBeat = 0;
  $('btnMic').textContent = '⏹ Stop muziekmodus';
  const loop = () => {
    an.getByteFrequencyData(data);
    let bass = 0; for (let i=1;i<=6;i++) bass += data[i];
    bass /= 6*255;                                   // 0-1
    const gain = 0.5 + $('sens').value/40;           // gevoeligheid
    const lvl = Math.min(1, bass*gain);
    avg = avg*0.96 + lvl*0.04;
    const now = performance.now();
    if (lvl > avg*1.35 + 0.08 && now-lastBeat > 180) { hue = (hue + 55) % 360; lastBeat = now; }
    smooth = Math.max(lvl, smooth*0.85);             // snelle attack, trage release
    $('level').style.width = (smooth*100)+'%';
    const c = hsv(hue, 1, 1);
    sendRGB(...dim(c, Math.pow(smooth, 1.2)));
    micRaf = requestAnimationFrame(loop);
  };
  loop();
}
function stopMic(){
  if (micRaf) cancelAnimationFrame(micRaf); micRaf = null;
  if (micStream) micStream.getTracks().forEach(t => t.stop()); micStream = null;
  if (micCtx) micCtx.close(); micCtx = null;
  $('btnMic').textContent = '🎤 Start muziekmodus';
  $('level').style.width = '0';
}
$('btnMic').onclick = () => micRaf ? (stopMic(), applyColor()) : startMic();

// ===== Scènes (localStorage) =====
function loadScenes(){ try { return JSON.parse(localStorage.getItem('ledScenes')||'[]'); } catch { return []; } }
function saveScenes(s){ try { localStorage.setItem('ledScenes', JSON.stringify(s)); } catch {} }
function renderScenes(){
  const box = $('scenes'); box.innerHTML = '';
  loadScenes().forEach((s,i) => {
    const row = document.createElement('div'); row.className = 'scene';
    const chip = document.createElement('div'); chip.className = 'chip'; chip.style.background = rgbToHex(s.r,s.g,s.b);
    const go = document.createElement('button'); go.textContent = `${s.name} (${s.bri}%)`;
    go.onclick = () => { stopFx(); stopMic(); base={r:s.r,g:s.g,b:s.b}; brightness=s.bri; $('bri').value=s.bri; $('briVal').textContent=s.bri+'%'; $('color').value=rgbToHex(s.r,s.g,s.b); applyColor(); };
    const del = document.createElement('button'); del.textContent = '✕';
    del.onclick = () => { const a=loadScenes(); a.splice(i,1); saveScenes(a); renderScenes(); };
    row.append(chip, go, del); box.appendChild(row);
  });
}
$('btnSaveScene').onclick = () => {
  const name = $('sceneName').value.trim() || 'Scène ' + (loadScenes().length+1);
  const a = loadScenes(); a.push({name, r:base.r, g:base.g, b:base.b, bri:brightness}); saveScenes(a);
  $('sceneName').value = ''; renderScenes();
};
renderScenes();

// ===== Timer =====
function cancelTimer(){ clearTimeout(timerHandle); clearInterval(timerTick); timerHandle=null; $('timerTxt').textContent=''; }
document.querySelectorAll('[data-timer]').forEach(b => b.onclick = () => {
  cancelTimer();
  const ms = +b.dataset.timer*60000; timerEnd = Date.now()+ms;
  timerHandle = setTimeout(async () => { stopFx(); stopMic(); await write(CMD_OFF); cancelTimer(); }, ms);
  timerTick = setInterval(() => { const m = Math.ceil((timerEnd-Date.now())/60000); $('timerTxt').textContent = `Strip gaat uit over ${m} min (houd dit tabblad open).`; }, 1000);
  $('timerTxt').textContent = `Strip gaat uit over ${b.dataset.timer} min (houd dit tabblad open).`;
});
$('btnTimerCancel').onclick = cancelTimer;
</script>
</body>
</html>
